<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRFlow - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPBQQZSyWxfusvbkwUmWUWFkVTHz_5wnE",
            authDomain: "hrticketing-program.firebaseapp.com",
            projectId: "hrticketing-program",
            storageBucket: "hrticketing-program.firebasestorage.app",
            messagingSenderId: "701523833641",
            appId: "1:701523833641:web:884cba2ec7759a9ae07d38",
            measurementId: "G-Q67YZR56W5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db; // Global access for legacy functions
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: white; border: 1px solid #e2e8f0; transition: all 0.3s ease; }
        .glass-card:hover { border-color: #cbd5e1; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-active { opacity: 1; transform: scale(1); transition: all 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-slate-900 p-2.5 rounded-2xl text-white shadow-xl shadow-slate-900/10">
                    <i data-lucide="layout-dashboard"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">HR Dashboard</h1>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded font-black uppercase tracking-widest">Admin Control</span>
                        <p class="text-[10px] uppercase font-black text-slate-400 tracking-widest">Enterprise Edition</p>
                    </div>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="clearAllData()" class="px-4 py-2 text-[10px] font-black uppercase text-red-500 border border-red-100 rounded-xl hover:bg-red-50 transition">Reset Database</button>
                <div class="px-4 py-2 bg-white border rounded-xl flex items-center gap-2 shadow-sm">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-[10px] font-black uppercase text-slate-600">Live Sync Aktif</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="glass-card p-6 rounded-[2rem]">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Tiket</p>
                        <h2 id="totalTiket" class="text-3xl font-black mt-1">0</h2>
                    </div>
                    <div class="glass-card p-6 rounded-[2rem] border-b-4 border-b-red-500">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Tertunda</p>
                        <h2 id="totalPending" class="text-3xl font-black mt-1 text-red-500">0</h2>
                    </div>
                    <div class="glass-card p-6 rounded-[2rem] border-b-4 border-b-green-500">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Selesai</p>
                        <h2 id="totalDone" class="text-3xl font-black mt-1 text-green-500">0</h2>
                    </div>
                </div>

                <div class="glass-card rounded-[2.5rem] overflow-hidden shadow-sm">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-white">
                        <h3 class="text-xs font-black uppercase tracking-widest flex items-center gap-2"><i data-lucide="list" size="16"></i> Daftar Laporan</h3>
                        <div class="flex gap-4">
                            <button onclick="exportToExcel()" class="text-[10px] font-bold text-emerald-600 hover:text-emerald-700 transition uppercase flex items-center gap-1">
                                <i data-lucide="download" size="12"></i> Export Excel
                            </button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left" id="reportTable">
                            <thead class="bg-slate-50/50 text-[10px] font-black uppercase text-slate-400 border-b border-slate-100">
                                <tr>
                                    <th class="px-6 py-4">Informasi Tiket</th>
                                    <th class="px-6 py-4">Kategori & Divisi</th>
                                    <th class="px-6 py-4">Status Saat Ini</th>
                                    <th class="px-6 py-4 text-right">Aksi & Update</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-slate-50 text-sm"></tbody>
                        </table>
                    </div>
                    <div id="emptyMsg" class="hidden py-32 text-center">
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Belum ada tiket</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 space-y-6">
                <div class="glass-card p-8 rounded-[2.5rem] bg-slate-900 text-white shadow-2xl relative overflow-hidden">
                    <h3 class="text-sm font-black uppercase mb-6 flex items-center gap-2 italic">Insight Engine</h3>
                    <div id="insightBox" class="space-y-4"></div>
                </div>
                <div class="glass-card p-8 rounded-[2.5rem] flex flex-col h-[500px]">
                    <h3 class="text-sm font-black uppercase tracking-widest mb-6">Aktivitas Terbaru</h3>
                    <div id="activityLog" class="space-y-5 overflow-y-auto custom-scrollbar flex-grow pr-2"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="noteModal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2rem] shadow-2xl overflow-hidden">
            <div class="p-6 bg-slate-900 text-white flex justify-between items-center">
                <h3 class="text-lg font-black italic">Berikan Progress</h3>
                <button onclick="closeNoteModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" size="20"></i></button>
            </div>
            <div class="p-8">
                <p id="modalTicketId" class="text-[10px] text-blue-600 font-bold uppercase mb-2"></p>
                <textarea id="hrNoteInput" rows="4" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none text-sm font-medium" placeholder="Tuliskan perkembangan..."></textarea>
                <button onclick="saveProgressNote()" class="w-full mt-6 py-4 bg-blue-600 text-white rounded-2xl font-black uppercase tracking-wider shadow-lg hover:bg-blue-700 transition">Simpan & Kirim</button>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase specific update helpers
        import { doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        window.updateFirebaseTicket = async (id, data) => {
            try { await updateDoc(doc(window.db, "tickets", id), data); } catch (e) { console.error("Sync Error", e); }
        };
        window.deleteFirebaseTicket = async (id) => {
            try { await deleteDoc(doc(window.db, "tickets", id)); } catch (e) { console.error("Sync Error", e); }
        };
    </script>

    <script>
        let selectedTicketId = null;
        lucide.createIcons();
        setInterval(loadData, 2000);
        loadData();

        function loadData() {
            const tickets = JSON.parse(localStorage.getItem('hrflow_tickets')) || [];
            const activities = JSON.parse(localStorage.getItem('hrflow_activities')) || [];
            
            document.getElementById('totalTiket').innerText = tickets.length;
            document.getElementById('totalPending').innerText = tickets.filter(t => t.status === 'Pending').length;
            document.getElementById('totalDone').innerText = tickets.filter(t => t.status === 'Done').length;

            const tbody = document.getElementById('tableBody');
            const empty = document.getElementById('emptyMsg');
            
            if(tickets.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                tbody.innerHTML = tickets.map(t => `
                    <tr class="hover:bg-slate-50/80 transition-colors group">
                        <td class="px-6 py-5">
                            <div class="flex flex-col">
                                <span class="text-[10px] font-black text-blue-600 uppercase">${t.id}</span>
                                <span class="font-bold text-slate-800 text-base">${t.employeeName}</span>
                                <span class="text-[10px] text-slate-400 font-bold uppercase">${t.date || ''}</span>
                            </div>
                        </td>
                        <td class="px-6 py-5">
                            <span class="text-[10px] font-black uppercase text-slate-500 block">${t.division}</span>
                            <span class="text-xs font-bold text-slate-600">${t.category}</span>
                        </td>
                        <td class="px-6 py-5">
                            <div class="flex flex-col gap-1.5">
                                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest w-fit ${
                                    t.status === 'Done' ? 'bg-green-50 text-green-600' : t.status === 'On Progress' ? 'bg-yellow-50 text-yellow-600' : 'bg-red-50 text-red-500'
                                }">${t.status}</span>
                                ${t.hrNote ? `<p class="text-[9px] text-slate-400 italic line-clamp-1">Note: ${t.hrNote}</p>` : ''}
                            </div>
                        </td>
                        <td class="px-6 py-5 text-right">
                            <div class="flex justify-end gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="openNoteModal('${t.id}')" class="p-2 hover:bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="message-square-text" size="18"></i></button>
                                <button onclick="setStatus('${t.id}', 'On Progress')" class="p-2 hover:bg-yellow-50 text-yellow-600 rounded-xl"><i data-lucide="play-circle" size="18"></i></button>
                                <button onclick="setStatus('${t.id}', 'Done')" class="p-2 hover:bg-green-50 text-green-600 rounded-xl"><i data-lucide="check-circle-2" size="18"></i></button>
                                <button onclick="deleteTicket('${t.id}')" class="p-2 hover:bg-red-50 text-red-400 rounded-xl"><i data-lucide="trash-2" size="18"></i></button>
                            </div>
                        </td>
                    </tr>
                `).join('');
                lucide.createIcons();
            }

            const logBox = document.getElementById('activityLog');
            logBox.innerHTML = activities.length === 0 ? '<p class="text-center mt-10 text-[10px] font-bold text-slate-300 uppercase">Kosong</p>' : 
                activities.map(a => `<div class="flex gap-4 items-start animate-fade-in"><div class="mt-1 w-2 h-2 rounded-full bg-blue-500 flex-shrink-0"></div><div><p class="text-xs font-bold text-slate-700">${a.text}</p><p class="text-[9px] text-slate-400 font-black uppercase">${a.time}</p></div></div>`).join('');

            updateInsights(tickets);
        }

        function openNoteModal(id) {
            selectedTicketId = id;
            const tickets = JSON.parse(localStorage.getItem('hrflow_tickets')) || [];
            const ticket = tickets.find(t => t.id === id);
            document.getElementById('modalTicketId').innerText = `ID: ${id}`;
            document.getElementById('hrNoteInput').value = ticket.hrNote || '';
            document.getElementById('noteModal').classList.remove('hidden');
        }

        function closeNoteModal() { document.getElementById('noteModal').classList.add('hidden'); selectedTicketId = null; }

        function saveProgressNote() {
            const note = document.getElementById('hrNoteInput').value;
            let tickets = JSON.parse(localStorage.getItem('hrflow_tickets')) || [];
            tickets = tickets.map(t => t.id === selectedTicketId ? {...t, hrNote: note} : t);
            localStorage.setItem('hrflow_tickets', JSON.stringify(tickets));
            
            // Backup to Firebase
            window.updateFirebaseTicket(selectedTicketId, { hrNote: note });

            logToActivity(`Memberikan Progress: ${selectedTicketId}`);
            closeNoteModal(); loadData();
        }

        function setStatus(id, newStatus) {
            let tickets = JSON.parse(localStorage.getItem('hrflow_tickets')) || [];
            tickets = tickets.map(t => t.id === id ? {...t, status: newStatus} : t);
            localStorage.setItem('hrflow_tickets', JSON.stringify(tickets));
            
            // Backup to Firebase
            window.updateFirebaseTicket(id, { status: newStatus });

            logToActivity(`Update Status: ${id} ke ${newStatus}`); loadData();
        }

        function deleteTicket(id) {
            if(confirm(`Hapus tiket ${id}?`)) {
                let tickets = JSON.parse(localStorage.getItem('hrflow_tickets')) || [];
                tickets = tickets.filter(t => t.id !== id);
                localStorage.setItem('hrflow_tickets', JSON.stringify(tickets));
                
                // Backup to Firebase
                window.deleteFirebaseTicket(id);

                logToActivity(`Menghapus Tiket: ${id}`); loadData();
            }
        }

        function logToActivity(msg) {
            let activities = JSON.parse(localStorage.getItem('hrflow_activities')) || [];
            activities.unshift({ text: msg, time: new Date().toLocaleTimeString('id-ID') });
            localStorage.setItem('hrflow_activities', JSON.stringify(activities.slice(0, 30)));
        }

        function updateInsights(tickets) {
            const box = document.getElementById('insightBox');
            if(tickets.length === 0) { box.innerHTML = '<p class="text-xs italic text-slate-400">Kosong</p>'; return; }
            const pending = tickets.filter(t => t.status === 'Pending').length;
            box.innerHTML = `<div class="p-5 bg-white/10 rounded-3xl border border-white/5"><p class="text-[10px] text-blue-400 font-black uppercase mb-1">Analisa</p><p class="text-sm font-bold text-white">${pending} pending.</p></div>`;
        }

        function clearAllData() {
            if(confirm("Hapus semua data?")) {
                localStorage.removeItem('hrflow_tickets');
                localStorage.removeItem('hrflow_activities');
                loadData();
            }
        }

        function exportToExcel() {
            const tickets = JSON.parse(localStorage.getItem('hrflow_tickets')) || [];
            if(tickets.length === 0) return alert("Kosong");
            const worksheet = XLSX.utils.json_to_sheet(tickets);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Tickets");
            XLSX.writeFile(workbook, `HR_Report.xlsx`);
        }
    </script>
</body>
</html>
