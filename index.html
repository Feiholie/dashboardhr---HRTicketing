<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
import { 
  getFirestore, collection, addDoc, onSnapshot, 
  updateDoc, deleteDoc, doc, getDocs 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// ================= FIREBASE CONFIG =================
const firebaseConfig = {
  apiKey: "AIzaSyCPBQQZSyWxfusvbkwUmWUWFkVTHz_5wnE",
  authDomain: "hrticketing-program.firebaseapp.com",
  projectId: "hrticketing-program",
  storageBucket: "hrticketing-program.firebasestorage.app",
  messagingSenderId: "701523833641",
  appId: "1:701523833641:web:884cba2ec7759a9ae07d38",
  measurementId: "G-Q67YZR56W5"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);

// ================= GLOBAL =================
let selectedTicketId = null;
let globalTickets = [];
let globalActivities = [];

// ================= REALTIME LISTENER =================
onSnapshot(collection(db, "tickets"), (snapshot) => {
    globalTickets = snapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
    }));
    renderAll();
});

onSnapshot(collection(db, "activities"), (snapshot) => {
    globalActivities = snapshot.docs.map(doc => doc.data());
    renderAll();
});

// ================= RENDER =================
function renderAll() {
    const tickets = globalTickets;
    const activities = globalActivities;

    // Stats
    document.getElementById('totalTiket').innerText = tickets.length;
    document.getElementById('totalPending').innerText = tickets.filter(t => t.status === 'Pending').length;
    document.getElementById('totalDone').innerText = tickets.filter(t => t.status === 'Done').length;

    const tbody = document.getElementById('tableBody');
    const empty = document.getElementById('emptyMsg');

    if(tickets.length === 0) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
    } else {
        empty.classList.add('hidden');
        tbody.innerHTML = tickets.map(t => `
            <tr class="hover:bg-slate-50/80 transition-colors group">
                <td class="px-6 py-5">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-black text-blue-600 uppercase">${t.id}</span>
                        <span class="font-bold text-slate-800 text-base">${t.employeeName}</span>
                        <span class="text-[10px] text-slate-400">${t.date || '-'}</span>
                    </div>
                </td>
                <td class="px-6 py-5">
                    <span>${t.division}</span><br>
                    <span class="text-xs">${t.category}</span>
                </td>
                <td class="px-6 py-5">
                    <span>${t.status}</span>
                    ${t.hrNote ? `<p class="text-[9px] text-slate-400">Note: ${t.hrNote}</p>` : ''}
                </td>
                <td class="px-6 py-5 text-right">
                    <button onclick="openNoteModal('${t.id}')">Note</button>
                    <button onclick="setStatus('${t.id}','On Progress')">Proses</button>
                    <button onclick="setStatus('${t.id}','Done')">Done</button>
                    <button onclick="deleteTicket('${t.id}')">Hapus</button>
                </td>
            </tr>
        `).join('');
    }

    // Activity
    const logBox = document.getElementById('activityLog');
    if(activities.length === 0){
        logBox.innerHTML = 'Belum ada aktivitas';
    } else {
        logBox.innerHTML = activities.map(a => `
            <div>
                <p>${a.text}</p>
                <small>${a.time}</small>
            </div>
        `).join('');
    }

    updateInsights(tickets);
}

// ================= FUNCTIONS =================
window.openNoteModal = function(id) {
    selectedTicketId = id;
    const ticket = globalTickets.find(t => t.id === id);

    document.getElementById('modalTicketId').innerText = `ID: ${id}`;
    document.getElementById('hrNoteInput').value = ticket?.hrNote || '';
    document.getElementById('noteModal').classList.remove('hidden');
}

window.closeNoteModal = function() {
    document.getElementById('noteModal').classList.add('hidden');
}

window.saveProgressNote = async function() {
    const note = document.getElementById('hrNoteInput').value;
    if(!selectedTicketId) return;

    const ref = doc(db, "tickets", selectedTicketId);
    await updateDoc(ref, { hrNote: note });

    logToActivity(`Progress: ${selectedTicketId}`);
    closeNoteModal();
}

window.setStatus = async function(id, status) {
    const ref = doc(db, "tickets", id);
    await updateDoc(ref, { status });

    logToActivity(`Status ${id} → ${status}`);
}

window.deleteTicket = async function(id) {
    if(confirm("Hapus tiket?")) {
        await deleteDoc(doc(db, "tickets", id));
        logToActivity(`Hapus ${id}`);
    }
}

async function logToActivity(text){
    await addDoc(collection(db, "activities"), {
        text,
        time: new Date().toLocaleTimeString('id-ID')
    });
}

window.clearAllData = async function() {
    if(confirm("Hapus semua data?")) {
        const snap = await getDocs(collection(db,"tickets"));
        snap.forEach(d => deleteDoc(d.ref));

        const act = await getDocs(collection(db,"activities"));
        act.forEach(d => deleteDoc(d.ref));
    }
}

// ================= INSIGHT =================
function updateInsights(tickets) {
    const insightBox = document.getElementById('insightBox');

    if(tickets.length === 0){
        insightBox.innerHTML = 'Menunggu data...';
        return;
    }

    const pending = tickets.filter(t=>t.status==='Pending').length;

    insightBox.innerHTML = `
        <div>
            <b>${pending} tiket pending</b>
        </div>
    `;
}
</script>
